<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper Pro</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />

<!-- Code AdSense factice retire (identifiant placeholder ca-pub-XXXX).
     La publicite est geree depuis React via <AdSlot>, jamais dans les iframes. -->
</head>
<body>

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
    <span class="theme-icon">☀️</span>
</button>

<button id="fullscreen-toggle" class="fullscreen-toggle" aria-label="Toggle fullscreen">
    <span class="fullscreen-icon">⛶</span>
</button>

<h1>Mines: <span id="mines-count">0</span></h1>

<div class="game-container">
    <div class="board-wrapper">
        <div id="board"></div>
        <div class="controls">
            <button id="flag-button">🚩</button>
            <button id="reset-button" onclick="location.reload()">🔄 Recommencer</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
